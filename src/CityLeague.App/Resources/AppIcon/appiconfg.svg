<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <!-- MauiIcon foreground: glass pitch mark on transparent -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Soft glass disc -->
  <circle cx="228" cy="228" r="168" fill="url(#plate)"/>
  <circle cx="228" cy="228" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8"/>
  <circle cx="228" cy="228" r="148" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Top reflection arc -->
  <path d="M 110 170 C 150 120, 306 120, 346 170"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>

  <!-- Pitch -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <rect x="138" y="142" width="180" height="172" rx="16" stroke-width="14"/>
    <line x1="138" y1="228" x2="318" y2="228" stroke-width="10"/>
    <circle cx="228" cy="228" r="32" stroke-width="10"/>
    <circle cx="228" cy="228" r="6" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Gold accent -->
  <circle cx="228" cy="348" r="8" fill="#F2A900"/>
</svg>
