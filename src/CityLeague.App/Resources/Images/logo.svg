<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06351A"/>
      <stop offset="48%" stop-color="#0B6B2E"/>
      <stop offset="100%" stop-color="#1FA85A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#F2A900" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#F2A900" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle badge -->
  <rect width="456" height="456" rx="108" fill="url(#pitch)"/>
  <rect width="456" height="456" rx="108" fill="url(#glow)"/>

  <!-- Outer glass rim -->
  <rect x="18" y="18" width="420" height="420" rx="96"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Frosted glass plate -->
  <rect x="56" y="56" width="344" height="344" rx="78"
        fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2.5"/>

  <!-- Top glass highlight -->
  <path d="M 92 118 C 140 78, 316 78, 364 118 L 350 148 C 308 118, 148 118, 106 148 Z"
        fill="url(#shine)"/>

  <!-- Pitch mark -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pitch outline -->
    <rect x="128" y="132" width="200" height="192" rx="18"
          stroke-width="14" stroke-opacity="0.95"/>
    <!-- Halfway line -->
    <line x1="128" y1="228" x2="328" y2="228" stroke-width="10" stroke-opacity="0.9"/>
    <!-- Center circle -->
    <circle cx="228" cy="228" r="36" stroke-width="10" stroke-opacity="0.95"/>
    <!-- Center spot -->
    <circle cx="228" cy="228" r="7" fill="#FFFFFF" stroke="none"/>
    <!-- Penalty arcs (subtle) -->
    <path d="M 168 132 C 176 156, 280 156, 288 132" stroke-width="7" stroke-opacity="0.55"/>
    <path d="M 168 324 C 176 300, 280 300, 288 324" stroke-width="7" stroke-opacity="0.55"/>
  </g>

  <!-- Gold accent gem -->
  <circle cx="228" cy="366" r="9" fill="#F2A900" fill-opacity="0.95"/>
  <circle cx="225" cy="363" r="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
