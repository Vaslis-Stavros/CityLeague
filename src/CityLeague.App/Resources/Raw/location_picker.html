<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background: #0B6B2E; }
    .leaflet-control-attribution { font-size: 10px; }
    .pitch-tooltip {
      background: #0B6B2E;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      font: 12px/1.2 Outfit, system-ui, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .pitch-tooltip::before { border-top-color: #0B6B2E !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', { zoomControl: true }).setView([37.9838, 23.7275], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var marker = null;
    var fieldLayer = L.layerGroup().addTo(map);

    function setMarker(lat, lng, zoom) {
      var ll = L.latLng(lat, lng);
      if (marker) {
        marker.setLatLng(ll);
      } else {
        marker = L.marker(ll).addTo(map);
      }
      if (typeof zoom === 'number' && zoom > 0) {
        map.setView(ll, zoom);
      } else {
        map.panTo(ll);
      }
      setTimeout(function () { map.invalidateSize(); }, 50);
    }

    function setFootballFieldsB64(b64) {
      try {
        fieldLayer.clearLayers();
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var fields = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        fields.forEach(function (f) {
          var m = L.circleMarker([f.lat, f.lng], {
            radius: 9,
            color: '#F2A900',
            fillColor: '#1FA85A',
            fillOpacity: 0.9,
            weight: 2
          });
          m.bindTooltip(f.name, {
            direction: 'top',
            offset: [0, -6],
            opacity: 0.95,
            className: 'pitch-tooltip'
          });
          m.on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            setMarker(f.lat, f.lng, null);
            window.location.href = 'https://cityleague.app/bridge/field'
              + '?lat=' + encodeURIComponent(f.lat)
              + '&lng=' + encodeURIComponent(f.lng)
              + '&name=' + encodeURIComponent(f.name || 'Football pitch');
          });
          fieldLayer.addLayer(m);
        });
        setTimeout(function () { map.invalidateSize(); }, 50);
      } catch (err) {
        console.log('fields parse failed', err);
      }
    }

    map.on('click', function (e) {
      setMarker(e.latlng.lat, e.latlng.lng, null);
      window.location.href = 'https://cityleague.app/bridge/maptap?lat=' + e.latlng.lat + '&lng=' + e.latlng.lng;
    });

    setTimeout(function () {
      map.invalidateSize();
      window.location.href = 'https://cityleague.app/bridge/mapready';
    }, 120);
  </script>
</body>
</html>
