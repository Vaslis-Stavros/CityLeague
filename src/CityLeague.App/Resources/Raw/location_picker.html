<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background: #0B6B2E; }
    .leaflet-control-attribution { font-size: 10px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', { zoomControl: true }).setView([37.9838, 23.7275], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var marker = null;

    function setMarker(lat, lng, zoom) {
      var ll = L.latLng(lat, lng);
      if (marker) {
        marker.setLatLng(ll);
      } else {
        marker = L.marker(ll).addTo(map);
      }
      if (typeof zoom === 'number' && zoom > 0) {
        map.setView(ll, zoom);
      } else {
        map.panTo(ll);
      }
      setTimeout(function () { map.invalidateSize(); }, 50);
    }

    map.on('click', function (e) {
      setMarker(e.latlng.lat, e.latlng.lng, null);
      // Hand the tap to the MAUI host via a custom URL (Navigating cancels the load).
      window.location.href = 'https://cityleague.app/bridge/maptap?lat=' + e.latlng.lat + '&lng=' + e.latlng.lng;
    });

    // Ready for the host after first layout.
    setTimeout(function () {
      map.invalidateSize();
      window.location.href = 'https://cityleague.app/bridge/mapready';
    }, 120);
  </script>
</body>
</html>
