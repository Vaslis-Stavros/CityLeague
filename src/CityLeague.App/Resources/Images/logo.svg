<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pitchGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14944A"/>
      <stop offset="45%" stop-color="#0B6B2E"/>
      <stop offset="100%" stop-color="#06351A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.15" y1="0" x2="0.65" y2="0.55">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App-icon badge -->
  <rect width="1024" height="1024" rx="228" fill="url(#pitchGreen)"/>
  <path d="M 120 90 C 280 40, 520 70, 640 220 C 520 180, 280 200, 160 360 Z"
        fill="url(#sheen)"/>

  <!-- Football pitch (top-down) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer boundary -->
    <rect x="268" y="168" width="488" height="688" rx="28"
          stroke-width="28" stroke-opacity="0.96"/>

    <!-- Halfway line -->
    <line x1="268" y1="512" x2="756" y2="512"
          stroke-width="22" stroke-opacity="0.94"/>

    <!-- Center circle + spot -->
    <circle cx="512" cy="512" r="92"
            stroke-width="22" stroke-opacity="0.96"/>
    <circle cx="512" cy="512" r="14" fill="#FFFFFF" stroke="none"/>

    <!-- Top penalty area -->
    <rect x="360" y="168" width="304" height="128" rx="10"
          stroke-width="20" stroke-opacity="0.92"/>

    <!-- Bottom penalty area -->
    <rect x="360" y="728" width="304" height="128" rx="10"
          stroke-width="20" stroke-opacity="0.92"/>
  </g>

  <!-- Gold accent (player / ball marker) -->
  <circle cx="700" cy="278" r="28" fill="#F2A900"/>
  <circle cx="692" cy="270" r="9" fill="#FFFFFF" fill-opacity="0.45"/>
</svg>
